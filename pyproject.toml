[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mrs_voxel_planner"
version = "0.1.0"
description = "Emulate MRS voxel placement on a 3D T1-weighted image"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy", "scipy", "nibabel", "pyqtgraph", "PyQt6"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
mrs_voxel_planner = "mrs_voxel_planner.app:main"

[tool.setuptools]
packages = ["mrs_voxel_planner"]
